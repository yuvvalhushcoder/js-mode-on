<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css_5.css">
    <script src="js_5.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>CALCULATOR</h1>
        <div>
            <label for="inputOne">First Input</label>
            <input type="number" required placeholder="Enter Number One" id="inputOne"/>
        </div>
        <div>
            <label for="inputTwo">Second Input</label>
            <input type="number" required placeholder="Enter Number Two" id="inputTwo"/>
        </div>
        <div>
            <button class="op" id="add">+</button>
            <button class="op" id="sub">-</button>
            <button class="op" id="mul">*</button>
            <button class="op" id="div">/</button>
        </div>
        <div>
            <button id="calculate">Calculate</button>
        </div>
        <h2 id="output">Result: </h2>
    </div>
</body>
</html>
